org: acme

include: ["*"]
exclude: ["*-sandbox", "*-archive"]
skip_archived: true
skip_forks: true

layers:
  orchestration: ["*-orchestration"]

overrides:
  legacy-monolith: { kind: service }

aliases:
  orders-service: ["orders.acme.com", "orders-legacy"]
  identity: ["login.acme.com", "sso"]

apps:
  platform-mono: ["portal-api", "web/portal-ui"]

host_patterns: ["{env}-{name}.acme.internal"]

shared_config_names: ["global", "application"]

ignore_hosts: ["localhost", "127.0.0.1", "*.example.com", "fonts.googleapis.com"]

envs:
  dev: ["dev", "development", "local"]
  stage: ["stage", "staging", "qa"]
  prod: ["prod", "production"]

runtime:
  sources: ["datadog"]
  datadog:
    envs: { prod: production, stage: staging }
    window_days: 7
