{{- $fullName := include "orders.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  template:
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          env:
            - name: PRICING_URL
              value: {{ .Values.env.PRICING_URL | quote }}
            - name: DB_URL
              value: {{ .Values.env.DB_URL | quote }}
            - name: RELEASE
              value: {{ .Release.Name }}
