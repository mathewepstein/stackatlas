name: stackatlas
description: Scan a GitHub org into an architecture map and write it as a static site.
branding:
  icon: map
  color: blue

inputs:
  org:
    description: GitHub org or user to scan.
    required: true
  token:
    description: >-
      Token that can read every repo in the org (fine-grained PAT or GitHub App token with
      contents:read and metadata:read). The workflow's own GITHUB_TOKEN sees only this repo.
    required: true
  config:
    description: Path to stackatlas.yml.
    default: stackatlas.yml
  out:
    description: Directory for graph.json and unresolved.json.
    default: out
  site:
    description: Directory for the static site.
    default: site
  python-version:
    description: Python version to run stackatlas with.
    default: "3.12"
  cache:
    description: Keep shallow clones between runs so unchanged repos are not re-cloned.
    default: "true"
  datadog-api-key:
    description: Datadog API key. With datadog-app-key, runtime traffic is overlaid on the graph.
    default: ""
  datadog-app-key:
    description: Datadog application key.
    default: ""
  datadog-site:
    description: Datadog site.
    default: datadoghq.com

outputs:
  site:
    description: Directory holding the static site.
    value: ${{ steps.export.outputs.site }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install stackatlas
      shell: bash
      env:
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: pip install --quiet "stackatlas @ git+https://github.com/${ACTION_REPOSITORY}@${ACTION_REF}"

    - uses: actions/cache@v6
      if: inputs.cache == 'true'
      with:
        path: ~/.cache/stackatlas
        key: stackatlas-${{ inputs.org }}-${{ github.run_id }}
        restore-keys: stackatlas-${{ inputs.org }}-

    - name: Scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        DD_API_KEY: ${{ inputs.datadog-api-key }}
        DD_APP_KEY: ${{ inputs.datadog-app-key }}
        DD_SITE: ${{ inputs.datadog-site }}
        ORG: ${{ inputs.org }}
        CONFIG: ${{ inputs.config }}
        OUT: ${{ inputs.out }}
      run: |
        args=(--org "$ORG" --config "$CONFIG" --out "$OUT")
        if [ -n "$DD_API_KEY" ]; then args+=(--runtime datadog); fi
        stackatlas scan "${args[@]}"

    - name: Export
      id: export
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        SITE: ${{ inputs.site }}
      run: |
        stackatlas export "$OUT" "$SITE" --force
        echo "site=$SITE" >> "$GITHUB_OUTPUT"
