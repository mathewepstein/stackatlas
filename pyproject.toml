[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackatlas"
dynamic = ["version"]
description = "Map every frontend, service, orchestration, and infra layer in a GitHub org, with file-level evidence for every edge."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["architecture", "dependency-graph", "github", "service-map", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-hcl2>=4.3",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
stackatlas = "stackatlas.cli:app"

[project.urls]
Homepage = "https://github.com/mathewepstein/stackatlas"
Issues = "https://github.com/mathewepstein/stackatlas/issues"

[tool.hatch.version]
path = "src/stackatlas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stackatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
