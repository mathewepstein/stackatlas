[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackatlas"
version = "0.1.0"
description = "Map every frontend, service, orchestration, and infra layer in a GitHub org, with file-level evidence for every edge."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
stackatlas = "stackatlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stackatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
